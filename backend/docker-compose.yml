services:
  fastapi:
    build:
      context: .
      dockerfile: DockerFile
    container_name: fastapi_container
    ports:
      - "8000:8000"
    image: fastapi_app
    environment:
      - DATABASE_URL=postgresql://postgres:Shakeeb_2025@db:5432/mydatabase
    depends_on:
      - db
    volumes:
      - ./:/app
    

  db:
    image: postgres:15
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Shakeeb_2025
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2
    container_name : redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data




volumes:
  postgres_data:
  redis_data:
